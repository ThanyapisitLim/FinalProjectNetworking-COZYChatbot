services:

  # ─── Nginx (Reverse Proxy / API Gateway) ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"          # entry point เดียวสำหรับทุก service
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - ai-api
      - ai-mcp
    networks:
      - app-net

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-net

  # ─── Backend (Express / TypeScript) ───────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_URL=redis://redis:6379        # ชี้ไปที่ service "redis"
      - AI_API_URL=http://ai-api:8000      # ชี้ไปที่ service "ai-api"
    depends_on:
      - redis
    networks:
      - app-net

  # ─── AI API (FastAPI + ChromaDB + Ollama client) ──────────────────────────
  ai-api:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

  # ─── AI MCP (FastMCP) ─────────────────────────────────────────────────────
  ai-mcp:
    build:
      context: ./ai
      dockerfile: Dockerfile.mcp
    container_name: ai-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

  # ─── Network Monitor Dashboard ───────────────────────────────────────────
  monitor:
    build:
      context: ./monitor
    container_name: monitor
    restart: unless-stopped
    ports:
      - "9000:80"            # เข้าถึงได้ที่ <Pi-IP>:9000 ในวงเดียวกัน
    networks:
      - app-net

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  redis_data:
