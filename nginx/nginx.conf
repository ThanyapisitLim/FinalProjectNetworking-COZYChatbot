# ─── Upstream Services ────────────────────────────────────────────────────────
# กำหนด upstream แต่ละ service โดยใช้ชื่อ container จาก docker-compose
# Docker internal DNS จะ resolve ชื่อเหล่านี้ให้อัตโนมัติ

upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:3001;
}

upstream ai_api {
    server ai-api:8000;
}

upstream ai_mcp {
    server ai-mcp:8080;
}

# ─── Server Block ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;  # รับทุก domain/IP

    # ─── Real IP (จาก Ngrok X-Forwarded-For) ─────────────────────────────────
    # Ngrok ส่ง IP จริงของ client มาใน X-Forwarded-For
    # บอก Nginx ให้เชื่อ header นี้และใช้เป็น real IP แทน Ngrok tunnel IP
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ─── Logging ──────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ─── Route: Frontend (Next.js) ────────────────────────────────────────────
    # รับทุก request ที่ไม่ match route อื่น → ส่งไป Next.js
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # จำเป็นสำหรับ WebSocket (Next.js HMR / future use)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # ส่ง header ต้นทางไปให้ service รู้ว่า request มาจากไหน
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Route: WebSocket Chat ────────────────────────────────────────────────
    # /ws/chat → backend:3001/ws/chat (WebSocket Protocol Upgrade)
    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # HTTP → WebSocket Protocol Upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    # ─── Route: NextAuth (ต้องอยู่ก่อน /api/ เสมอ) ───────────────────────────
    # /api/auth/* เป็น NextAuth route ที่อยู่ใน Next.js ไม่ใช่ Backend
    location /api/auth/ {
        proxy_pass http://frontend/api/auth/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Route: Backend API (Express) ─────────────────────────────────────────
    # /api/login     → backend:3001/login
    # /api/message   → backend:3001/message
    # /api/api-docs  → backend:3001/api-docs  (Swagger UI)
    location /api/ {
        # rewrite ตัด prefix /api ออก ก่อนส่งต่อ
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # ─── Route: AI API (FastAPI + RAG) ────────────────────────────────────────
    # /ai/ask  → ai-api:8000/ask
    # /ai/docs → ai-api:8000/docs  (FastAPI Swagger)
    location /ai/ {
        rewrite ^/ai/(.*) /$1 break;

        proxy_pass http://ai_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # เพิ่ม timeout สำหรับ AI ที่ใช้เวลานาน
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ─── Route: MCP Server (FastMCP) ──────────────────────────────────────────
    # /mcp → ai-mcp:8080/mcp  (MCP Protocol over Streamable HTTP)
    location /mcp {
        proxy_pass http://ai_mcp/mcp;
        proxy_http_version 1.1;

        # MCP ใช้ streaming → ต้องปิด buffering
        proxy_buffering    off;
        proxy_cache        off;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }
}
